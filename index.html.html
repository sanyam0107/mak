["q5","c5","Steel structures","Requirements Pending","Steel structure, Abu Dhabi, 12 week target","2026-11-23",null,[],[]],
["q6","c1","PEB warehouse","Won","Yard shed 30 x 15 m, Sharjah","2026-09-01","2026-09-08",[{s:"ST-IB-300",q:30,r:400},{s:"RF-PU-50",q:450,r:95}],["yard_shed.dwg"]]]);

["k5","Intake Agent","Inbound","c6",33,"No answer / dropped","Call dropped before requirements were captured.","None","2026-11-18 17:20"]]);
return{clients:c,convs,mats:m,quotes:q,projects:p,calls,agents:[{id:"a1",name:"Intake Agent",role:"Inbound enquiries",st:"Online"},{id:"a2",name:"Follow-up Agent",role:"Outbound follow-ups",st:"Online"},{id:"a3",name:"Quote Chaser",role:"Sent quotation reminders",st:"Paused"}],
fups:[{id:"f1",cid:"c2",text:"Call about sent roofing quotation",due:"2026-11-28",owner:"S. Khan"}],moves:[{id:"t1",sku:"CL-SS-05",type:"Receipt",qty:500,ref:"PO-demo-114",at:"2026-11-20"},{id:"t2",sku:"ST-IB-300",type:"Allocation",qty:30,ref:"p2",at:"2026-11-14"}],imps:[],
logs:[{id:"l1",t:"2026-11-23 09:41",mod:"AI Calling",text:"Call k3 escalated to human",cid:"c5"},{id:"l2",t:"2026-11-22 10:14",mod:"AI Calling",text:"Call k1 captured mezzanine requirements",cid:"c3"},{id:"l3",t:"2026-11-12 14:00",mod:"Quotations",text:"Quotation q1 created",cid:"c1"}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.clients)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},log=(text,mod,cid)=>{S.logs.unshift({id:nid("l"),t:now(),mod,text,cid:cid||null});save()};
let cur="dash",ui={q:"",t:"Overview",pv:"table",csv:null},sim=null,iv=null;
const cl=id=>by(S.clients,id)||{name:"Unmatched",id:null},free=x=>x.avail-x.res,low=x=>free(x)<=x.reorder,qt=x=>x.items.reduce((a,i)=>a+i.q*i.r,0),fm=n=>n?"AED "+n.toLocaleString("en-US"):"Rates pending";

const tbl=(h,rows)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.join("")||`<tr><td colspan="${h.length}" class="mu">No records match. Adjust the search or filters.</td></tr>`}</table></div>`;
const opts=(a,v)=>a.map(o=>{o=[].concat(o);return`<option value="${esc(o[0])}" ${o[0]===v?"selected":""}>${esc(o[1]??o[0])}</option>`}).join("");
function ex(t){const r=[];let x;if(x=t.match(/(\d+)\s*m?\s*[x×]\s*(\d+)/i))r.push(["Footprint",x[1]+" × "+x[2]+" m"]);if(x=t.match(/(?:eave|height)[^\d]{0,15}(\d+(?:\.\d+)?)\s*m/i))r.push(["Eave height",x[1]+" m"]);if(x=t.match(/(\d[\d,]*)\s*m2/i))r.push(["Area",x[1]+" m2"]);

conv(d){cur="comm";ui.cv=d.i;ui.sel=null;ui.q="";render()},call(d){cur="calls";ui.sel=d.i;render()},newc(){clientForm(null,v=>{const c={id:nid("c"),...v,last:today()};S.clients.push(c);log("Client created: "+c.name,"Clients",c.id)})},
